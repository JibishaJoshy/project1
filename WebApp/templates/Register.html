<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
 <div class="container">
      <!--Data or Content-->
      <div class="box-1">
          <div class="content-holder">
<!--              <h2>Hello!</h2>-->

              <button class="button-1" onclick="signup()">Sign up</button>
<!--              <button class="button-2" onclick="login()">Login</button>-->
          </div>
      </div>


      <!--Forms-->
      <div class="box-2">
          <form method="post" action="{% url 'UserLogin' %}">
              {% csrf_token %}
          <div class="login-form-container">
              <h1>Login Form</h1>
              <input type="text" placeholder="Username" class="input-field" name="username">
              <br><br>
              <input type="password" placeholder="Password" class="input-field" name="pass">
              <br><br>
              <button class="login-button" type="submit">Login</button>
              </form>
          </div>



<!--Create Container for Signup form-->

      <div class="signup-form-container">
          <form method="post" action="{% url 'save_Register' %}" name="myform" onsubmit="return newfunction()">
          {% csrf_token %}
          <h1>Sign Up Form</h1>
          <input type="text" placeholder="Username" class="input-field" name="username">
          <br><br>
          <input type="email" placeholder="Email" class="input-field" name="email">
          <br><br>
          <input type="password" placeholder="Password" class="input-field" name="pass1">
          <br><br>
          <input type="password" placeholder="Confirm Password" class="input-field" name="pass2">
          <br><br>
          <button class="signup-button" type="submit" >Sign Up</button>
          </form>
      </div>




      </div>
     <style>
         *{
  margin: 0px;
  padding: 0px;;
}

body{
  font-family: Arial, Helvetica, sans-serif;
}

.container
{
  display: grid;
  grid-template-columns: 1fr 2fr;
  background-color: red;
  background: linear-gradient(to bottom, rgb(6, 108, 100),  rgb(14, 48, 122));
  width: 800px;
  height: 400px;
  margin: 10% auto;;
  border-radius: 5px;
}

.content-holder
{
  text-align: center;
  color: white;
  font-size: 14px;
  font-weight: lighter;
  letter-spacing: 2px;
  margin-top: 15%;
  padding: 50px;
}

.content-holder h2
{
  font-size: 34px;
  margin: 20px auto;
}

.content-holder p
{
  margin: 30px auto;
}

.content-holder button
{
  border:none;
  font-size: 15px;
  padding: 10px;
  border-radius: 6px;
  background-color: white;
  width: 150px;
  margin: 20px auto;
}


.box-2{
  background-color: white;

  margin: 5px;
}

.login-form-container
{
  text-align: center;
  margin-top: 10%;

}

.login-form-container h1
{
  color: black;
  font-size: 24px;
  padding: 20px;
}

.input-field
{
  box-sizing: border-box;
  font-size: 14px;
  padding: 10px;
  border-radius: 7px;
  border: 1px solid rgb(168, 168, 168);
  width: 250px;
  outline: none;
}

.login-button{
  box-sizing: border-box;
  color: white;
  font-size: 14px;
  padding: 13px;
  border-radius: 7px;
  border: none;
  width: 250px;
  outline: none;
  background-color: rgb(56, 102, 189);
}



.button-2
{
  display: none;
}





.signup-form-container
{
  position: relative;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-60%);
  text-align: center;
  display: none;
}


.signup-form-container h1
{
  color: black;
  font-size: 24px;
  padding: 20px;
}

.signup-button{
  box-sizing: border-box;
  color: white;
  font-size: 14px;
  padding: 13px;
  border-radius: 7px;
  border: none;
  width: 250px;
  outline: none;
  background-color: rgb(56, 189, 149);
}

     </style>
     <script>
         function signup()
{
    document.querySelector(".login-form-container").style.cssText = "display: none;";
    document.querySelector(".signup-form-container").style.cssText = "display: block;";
    document.querySelector(".container").style.cssText = "background: linear-gradient(to bottom, rgb(56, 189, 149),  rgb(28, 139, 106));";
    document.querySelector(".button-1").style.cssText = "display: none";
    document.querySelector(".button-2").style.cssText = "display: block";

};

function login()
{
    document.querySelector(".signup-form-container").style.cssText = "display: none;";
    document.querySelector(".login-form-container").style.cssText = "display: block;";
    document.querySelector(".container").style.cssText = "background: linear-gradient(to bottom, rgb(6, 108, 224),  rgb(14, 48, 122));";
    document.querySelector(".button-2").style.cssText = "display: none";
    document.querySelector(".button-1").style.cssText = "display: block";

}
function newfunction(){
            a = document.myform.pass1.value;
            b = document.myform.pass2.value;
            c = document.myform.username.value;

            if (c == null || c ==""){
                alert("Name can't be blank..")
                return false
            }
            else if (a.length<5){
                alert("Please create a password contain atleat 5 characters..")
                return false
            }
            else if (a==b){
                return true
            }
            else {
                alert("Please enter the correct password..")
                return false
            }
        }
     </script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>>
{% if messages %}
    {% for i in messages %}
        {% if i.tags == 'warning' %}
            <script>
                swal('{{i}}', '', 'warning')
            </script>
        {% elif i.tags == 'error' %}
            <script>
                swal('{{i}}', '', 'error')
            </script>
        {% elif i.tags == 'info' %}
            <script>
                swal('{{i}}', '', 'info')
            </script>
        {% else %}
            <script>
                swal('{{i}}', '', 'success')
            </script>
        {% endif %}
    {% endfor %}
 {% endif %}





</body>
</html>
